services:
  - type: worker
    name: telegram-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: openrouter/free
      - key: FOLDER_NAME
        value: Личные
      - key: HISTORY_LIMIT
        value: "5000"
      - key: CONTEXT_MESSAGES
        value: "24"
      - key: STYLE_EXAMPLES
        value: "8"
      - key: MAX_OUTPUT_TOKENS
        value: "512"
      - key: DATA_DIR
        value: /data
      - key: TELEGRAM_SESSION
        value: /data/telegram_ai
